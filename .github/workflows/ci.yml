name: CI (Full)

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed to skip unnecessary jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U memory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # Backend uses gRPC on 6334 (config.toml [qdrant]); 6333 is REST, mapped
      # only for the health-check probe (mirrors docker-compose.yml).
      qdrant:
        image: qdrant/qdrant:v1.9.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/localhost/6333'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqlx
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: which sqlx || cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all
        env:
          SQLX_OFFLINE: "true"

      # `--include-ignored` is REQUIRED, not optional. The cross-tenant RLS
      # isolation tests are marked `#[ignore]` so that a developer running
      # `cargo test` on a machine without Postgres sees an honest `ignored`
      # instead of a false `ok`. Plain `cargo test` would therefore SKIP the
      # most security-critical suite in the repo exactly where it CAN run.
      # CI provides Postgres, so it must opt back in.
      #
      # `--tests` restricts this to unit + integration targets. Doc-tests are
      # excluded deliberately: some doc examples are illustrative snippets
      # marked ```ignore``` that do not compile standalone, and
      # `--include-ignored` would try to run them and fail.
      #
      # Tests needing services CI does not provide (Qdrant-backed e2e, Ollama)
      # keep an internal env-var guard and still self-skip, so this is safe.
      - name: Test (unit + integration, including PG-gated)
        run: cargo test --tests -- --include-ignored
        timeout-minutes: 30
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory
          SQLX_OFFLINE: "true"

      # Doc-tests run separately so their own `ignore` markers are respected.
      - name: Doc tests
        run: cargo test --doc
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory
          SQLX_OFFLINE: "true"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ant-design-pro-template

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/ant-design-pro-template/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
