name: CI (Full)

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which parts of the repo changed to skip unnecessary jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: memory
          POSTGRES_PASSWORD: memory
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U memory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # Backend uses gRPC on 6334 (config.toml [qdrant]); 6333 is REST, mapped
      # only for the health-check probe (mirrors docker-compose.yml).
      qdrant:
        image: qdrant/qdrant:v1.9.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd="bash -c 'echo > /dev/tcp/localhost/6333'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=10s

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned, NOT @stable. `cargo fmt --all -- --check` below is a blocking
        # gate and rustfmt's formatting changes between releases, so a floating
        # @stable makes CI disagree with contributors' local rustfmt. Keep this
        # version in sync with /rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/sqlx
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install sqlx-cli
        run: which sqlx || cargo install sqlx-cli --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all
        env:
          SQLX_OFFLINE: "true"

      # `--include-ignored` is REQUIRED, not optional. The cross-tenant RLS
      # isolation tests are marked `#[ignore]` so that a developer running
      # `cargo test` on a machine without Postgres sees an honest `ignored`
      # instead of a false `ok`. Plain `cargo test` would therefore SKIP the
      # most security-critical suite in the repo exactly where it CAN run.
      # CI provides Postgres, so it must opt back in.
      #
      # `--tests` restricts this to unit + integration targets. Doc-tests are
      # excluded here and run as their own step below, so that each set's
      # `ignore` markers are respected independently: `--include-ignored` would
      # otherwise force-run doc examples that are deliberately marked `ignore`.
      #
      # Tests needing services CI does not provide (Qdrant-backed e2e, Ollama)
      # keep an internal env-var guard and still self-skip, so this is safe.
      - name: Test (unit + integration, including PG-gated)
        run: cargo test --tests -- --include-ignored
        timeout-minutes: 30
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory
          SQLX_OFFLINE: "true"

      # Doc-tests run separately so their own `ignore` markers are respected.
      - name: Doc tests
        run: cargo test --doc
        timeout-minutes: 10
        env:
          DATABASE_URL: postgres://memory:memory@localhost:5432/memory
          SQLX_OFFLINE: "true"

  # A2A agent-interop protocol channel. A SEPARATE job (not a step in `backend`)
  # on purpose: the `a2a` feature pulls a2a-rs from a pinned GitHub rev, so a
  # cold-cache build must reach GitHub over the network. Folding it into `backend`
  # would put that job's security-critical suite (RLS isolation, fmt, clippy) at
  # the mercy of GitHub availability — one network blip fetching a2a-rs would red
  # the whole backend gate. A dedicated job contains that blast radius while STILL
  # blocking the workflow: there is deliberately NO continue-on-error, so if the
  # feature stops compiling or a test regresses, this job goes red.
  #
  # History worth keeping: `tests/a2a_integration.rs` is gated by a file-level
  # `#![cfg(feature = "a2a")]`, so without this job the whole file compiled to
  # nothing and its tests SILENTLY DID NOT EXIST — not failed, absent. Running them
  # for the first time on 2026-08-11 immediately surfaced a real bug: the a2a router
  # was merged without `auth_middleware`, so the handlers' `Extension<RequestTenant
  # Context>` extractor failed and 4 of 7 returned 500. Fixed in backlog A-4b.
  #
  # No Postgres/Qdrant service and no DATABASE_URL: the crate uses runtime sqlx
  # (`sqlx::query` / `.bind`), not compile-checked `query!` macros, so it builds
  # fully offline, and these tests build the router in-process without a DB pool.
  # The one test that does need real infra is `#[ignore]`d with its reason stated,
  # so `cargo test` reports it as honestly skipped rather than silently passing.
  backend-a2a:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # Pinned to match the `backend` job (keep in sync with rust-toolchain.toml).
        # No clippy/rustfmt components: this job only compiles.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Separate key from `backend`: the a2a feature set produces different
          # artifacts and pulls the a2a-rs git dep the main cache never populates.
          # The restore-keys fallback still warms the crate registry from that cache.
          key: ${{ runner.os }}-cargo-a2a-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-a2a-
            ${{ runner.os }}-cargo-

      # Compiles the production bin + lib WITH the feature. This is what guards the
      # `#[cfg(feature = "a2a")]` router mount in routers/mod.rs against bit-rot —
      # code only reachable under the feature is otherwise never type-checked in CI.
      - name: Build backend with a2a feature
        run: cargo build --features a2a
        timeout-minutes: 30
        env:
          SQLX_OFFLINE: "true"

      # Compiles the integration target. Kept as its own step from the build so a
      # test-only compile error is distinguishable from a lib/bin one in the log.
      - name: Compile a2a integration tests
        run: cargo test --features a2a --test a2a_integration --no-run
        timeout-minutes: 15
        env:
          SQLX_OFFLINE: "true"

      # Full suite, no filter and no allow-failure. An earlier revision of this job
      # ran only the 3 tests that passed at the time, because the other 4 were red
      # from the missing-auth bug; that filter is gone now A-4b has landed.
      #
      # Measured 2026-08-11 after the fix: 7 passed, 0 failed, 1 ignored.
      # The ignored one is `test_rest_send_message` — it performs a real LTM write,
      # so it needs a reachable embedding backend plus a DB. It carries an explicit
      # `#[ignore]` reason, which is what makes `cargo test` report it as honestly
      # skipped instead of quietly green. Run it under e2e infra with `--ignored`.
      #
      # Do NOT reintroduce a name filter or `|| true` here: a run that cannot fail
      # is not a gate, and a filter silently narrows the moment someone adds a test.
      - name: Run a2a integration tests
        run: cargo test --features a2a --test a2a_integration
        timeout-minutes: 15
        env:
          SQLX_OFFLINE: "true"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ant-design-pro-template

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/ant-design-pro-template/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Blocking as of 2026-08-11 (backlog E-3). This step carried
      # `continue-on-error: true` while the repo had 22 blocking lint failures
      # (8 biome errors + 14 tsc errors), which made it a gate that could not
      # fail — the exact "門禁存在但不起作用" pattern this remediation targets.
      # Those were cleared (real fixes; one reviewed inline biome-ignore for a
      # DOMPurify false positive), so the flag is gone and lint now blocks.
      #
      # `npm run lint` runs `biome:lint && tsc --noEmit`. tsc is the half that
      # earns the gate: it caught a live ReferenceError (a component using `intl`
      # without `useIntl()`) that had been shipping unnoticed.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
