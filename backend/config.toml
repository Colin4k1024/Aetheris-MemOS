listen_addr = "127.0.0.1:8008"

[db]
# PostgreSQL (local: start with docker compose up -d postgres, or set DATABASE_URL)
#
# ⚠️  LOCAL DEVELOPMENT ONLY — this password matches docker/initdb/01-create-app-role.sql.
#     Production and staging MUST override DATABASE_URL with a credential from a
#     secrets manager (Vault, AWS Secrets Manager, k8s secrets, etc.) and must never
#     use this default. The role is intentionally NOSUPERUSER NOBYPASSRLS so that
#     Row Level Security is actually enforced.
#
#     Administrative cross-tenant maintenance uses the separate db.admin_url setting.
url = "postgres://aetheris_app:aetheris_app@localhost:5432/memory"
# 连接池配置
pool_size = 10
min_idle = 2
connection_timeout = 30
statement_timeout = 30

[jwt]
# 生产环境必须通过 APP_JWT_SECRET 环境变量设置强随机密钥，勿使用示例值
secret = "REPLACE_WITH_STRONG_SECRET_OR_USE_APP_JWT_SECRET"
expiry = 3600

[log]
file_name = "app.log"
rolling = "daily"

[llm]
# Ollama 配置
base_url = "http://localhost:11434"
model = "llama3.2"
timeout_seconds = 30

[embedding]
# 嵌入模型配置（通过 Ollama）
base_url = "http://localhost:11434"
model = "nomic-embed-text"
dimension = 768
timeout_seconds = 30

[qdrant]
# Qdrant 向量数据库配置
# 注意：qdrant-client 使用 gRPC，需要端口 6334（gRPC），而不是 6333（HTTP REST API）
host = "localhost"
port = 6334
# 一个 collection 只能承载一种 embedding 模型产出的向量空间。
# 若切换 [embedding].model（例如从 nomic-embed-text/768 换到 text-embedding-v4/1024），
# 必须同时改 collection_name —— 否则 vector_guard 会检出维度冲突并拒绝启动。
# 复用同名 collection 的唯一「恢复」方式是丢数据重建，改名则可无损共存。
# 这也是 local.toml（本地覆盖，已 gitignore）与本文件并存时最容易踩的坑：
# 两者若都写 "long_term_memory"，切换配置就会碰撞。
collection_name = "long_term_memory"
vector_dimension = 768
# Cosine matches the retrieval layer (higher score = more similar, in [0,1]).
# NOTE: changing this on an existing collection has no effect until the collection
# is dropped and recreated — Qdrant fixes the distance metric at creation time.
distance_type = "Cosine"

[rerank]
# Rerank 重排序配置
base_url = "http://localhost:11434"
model = "bge-reranker-base"
enabled = true
candidate_multiplier = 2
min_score_threshold = 0.3
timeout_seconds = 30

[neo4j]
# Neo4j图数据库配置（密码可通过 APP_NEO4J_PASSWORD 环境变量覆盖）
host = "localhost"
port = 7687
username = "neo4j"
password = "REPLACE_WITH_YOUR_NEO4J_PASSWORD"
database = "neo4j"

[memory_evolution]
decay_lambda = 0.01

[redis]
# Redis configuration for STM cache (enabled via redis-stm feature)
url = "redis://localhost:6379"
pool_size = 10
default_ttl_seconds = 3600

[otel]
# OpenTelemetry tracing — disabled locally by default
# Enable by pointing to a local Jaeger: enabled = true, endpoint = "http://localhost:4317"
enabled = false
endpoint = "http://localhost:4317"
service_name = "aetheris-memos-backend"
