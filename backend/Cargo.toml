[package]
name = "backend"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
readme = "./README.md"

[features]
default = []
# Enterprise features. Scope: metering / billing routes ONLY (backlog A-3).
#
# This used to read "billing, cluster management, RBAC, governance hooks".
# Implementing that literally would compile RBAC and the governance middleware out
# of the default build — and those carry the authorization path on all three
# protocol planes (hoops/governance.rs, routers/mcp.rs, a2a/handler.rs), so the MIT
# binary would ship with no authorization at all. C-1 explicitly requires that the
# strong-typed authorization path not depend on enterprise wiring. Security is not
# the monetised surface; metering is.
#
# The quota half of governance needs no compile gate either: try_enterprise_hooks()
# returns Option and is already inert whenever the hook set was not initialised.
#
# CI compiles BOTH channels (default and --features enterprise) so an ungated
# reference cannot slip into the MIT build. See routers::billing_router for the
# full rationale and routers::enterprise_gate for the drift guards.
enterprise = []
# Enable Redis STM cache adapter
redis-stm = ["dep:redis"]
# A2A agent-interoperability protocol. OFF by default (intentionally not in
# `default`): its git deps (a2a-rs, pinned by rev below) are fetched from GitHub
# during dependency RESOLUTION even when `optional`, so putting a2a in `default`
# would make every offline / first-time build need network. Build it explicitly
# with `--features a2a` (the first resolve fetches the pinned rev from GitHub). CI
# compiles this feature in a dedicated `backend-a2a` job (.github/workflows/ci.yml).
a2a = ["dep:a2a", "dep:a2a-server"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
figment = { version = "0.10", features = ["env", "toml"] }
jsonwebtoken = {version = "10", features = ["rust_crypto"]}
rust-embed = "8"
serde = "1"
thiserror = "2"
time = "0.3"
tokio = {version = "1", features = ["full"]}
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "metrics"] }
tracing = "0.1"
utoipa = "5"
utoipa-scalar = { version = "0.3", features = ["axum"] }
validator = {version = "0.20", features = ["derive"]}
ulid = "1"
argon2 = "0.5"
cookie = "0.18"
dotenvy = "0.15"
tracing-appender ="0.2"
tracing-subscriber = {version = "0.3", features = ["std", "fmt", "env-filter", "tracing-log", "time", "local-time", "json"]}
tklog = "0.3.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "postgres", "sqlite", "migrate"]}
serde_json = "1"
rinja = "0.3"
rand = "0.9"
once_cell = "1.19"
langchain-rust = { git = "https://github.com/Abraxas-365/langchain-rust", rev = "cfc709a71fee02083ced078252d73c1f76fe9849", features = ["ollama"] }
reqwest = { version = "0.12", features = ["json"] }
qdrant-client = "1.7"
sysinfo = "0.29"
chrono = "0.4"
moka = { version = "0.11", features = ["future"] }
neo4rs = "0.8"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
wasmtime = "20"
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.27"
tonic = { version = "0.12", features = ["prost"] }
prost = "0.13"
axum-prometheus = "0.1"
prometheus = "0.13"
metrics = "0.21"

# A2A Protocol deps. `optional = true` — pulled in only when the `a2a` feature is
# enabled (see [features] above). Pinned by `rev` for reproducibility; the first
# build with `--features a2a` fetches this rev from GitHub (needs network). Keep the
# two revs identical (same upstream repo).
a2a = { package = "a2a-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "0b19af0e2805455c01f8f2b7fb52c5d5ec1bce95", optional = true }
a2a-server = { package = "a2a-server-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "0b19af0e2805455c01f8f2b7fb52c5d5ec1bce95", optional = true }
uuid = { version = "1", features = ["v4"] }

# Redis support (enabled by redis-stm feature)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }
[build-dependencies]
tonic-build = "0.12"
