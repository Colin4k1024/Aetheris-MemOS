[package]
name = "backend"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
readme = "./README.md"

[features]
default = []
# Enterprise features: billing, cluster management, RBAC, governance hooks
enterprise = []
# Enable Redis STM cache adapter
redis-stm = ["dep:redis"]
# A2A agent-interoperability protocol. OFF by default. Its git deps (a2a-rs) are
# commented out below because even as `optional` they are pulled during dependency
# RESOLUTION (to build the lockfile), which requires network and breaks offline/CI
# builds. This is a bare cfg flag so `#[cfg(feature = "a2a")]` is a recognised
# feature. To enable A2A:
#   1) uncomment + pin the a2a/a2a-server deps in [dependencies] below,
#   2) change this to: a2a = ["dep:a2a", "dep:a2a-server"],
#   3) build with `--features a2a` (needs network for the first resolve).
a2a = []

[dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
figment = { version = "0.10", features = ["env", "toml"] }
jsonwebtoken = {version = "10", features = ["rust_crypto"]}
rust-embed = "8"
serde = "1"
thiserror = "2"
time = "0.3"
tokio = {version = "1", features = ["full"]}
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "metrics"] }
tracing = "0.1"
utoipa = "5"
utoipa-scalar = { version = "0.3", features = ["axum"] }
validator = {version = "0.20", features = ["derive"]}
ulid = "1"
argon2 = "0.5"
cookie = "0.18"
dotenvy = "0.15"
tracing-appender ="0.2"
tracing-subscriber = {version = "0.3", features = ["std", "fmt", "env-filter", "tracing-log", "time", "local-time", "json"]}
sqlx = { version = "0.8", features = ["runtime-tokio", "macros", "postgres", "sqlite", "migrate"]}
serde_json = "1"
rinja = "0.3"
rand = "0.9"
once_cell = "1.19"
langchain-rust = { git = "https://github.com/Abraxas-365/langchain-rust", rev = "cfc709a71fee02083ced078252d73c1f76fe9849", features = ["ollama"] }
reqwest = { version = "0.12", features = ["json"] }
qdrant-client = "1.7"
sysinfo = "0.29"
chrono = "0.4"
moka = { version = "0.11", features = ["future"] }
neo4rs = "0.8"
async-trait = "0.1"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
wasmtime = "20"
opentelemetry = { version = "0.26", features = ["trace"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.27"
tonic = { version = "0.12", features = ["prost"] }
prost = "0.13"
axum-prometheus = "0.1"
prometheus = "0.13"
metrics = "0.21"

# A2A Protocol support — COMMENTED OUT so offline/CI builds don't try to resolve
# these unpinned git crates. Re-enable via the `a2a` feature (see [features] note):
# pin a `rev` first (run online once: `cargo update -p a2a-lf -p a2a-server-lf`
# then copy the commit from Cargo.lock), then uncomment:
# a2a = { package = "a2a-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "<PIN_ME>", optional = true }
# a2a-server = { package = "a2a-server-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "<PIN_ME>", optional = true }
uuid = { version = "1", features = ["v4"] }

# Redis support (enabled by redis-stm feature)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }