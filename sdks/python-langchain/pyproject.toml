[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-memory-langchain"
version = "0.1.0"
description = "LangChain integration for Aetheris MemOS Adaptive Memory System"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Aetheris MemOS Team"}]

dependencies = [
    "adaptive-memory>=0.1.0",
    "langchain-core>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
include = ["adaptive_memory_langchain*"]
